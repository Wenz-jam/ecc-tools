name: CI

# Every pull request runs the full CI unconditionally: "Build Wheel" and
# "Test Python API" are required status checks on main, and a paths filter
# would leave those checks pending forever on PRs that match no path,
# blocking merge.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build wheel
        uses: ./.github/actions/build-wheel

      - name: Run iMJ design tools regression
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake --build build --target test_imj_design_tools --parallel 2
          ctest --test-dir build -R '^test_imj_design_tools$' --output-on-failure --no-tests=error

      - name: Upload repaired wheel
        uses: actions/upload-artifact@v4
        with:
          name: ecc-tools-wheel
          path: dist/wheel/repaired/*.whl
          if-no-files-found: error

  test-python-api:
    name: Test Python API
    needs: build-wheel
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test prerequisites
        run: dnf install -y git make curl tar bzip2 unzip

      - name: Setup Python 3.11
        run: echo "/opt/python/cp311-cp311/bin" >> "$GITHUB_PATH"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true

      - name: Download repaired wheel
        uses: actions/download-artifact@v4
        with:
          name: ecc-tools-wheel
          path: dist/wheel/repaired

      - name: Install built wheel
        run: |
          uv venv .venv-test
          uv pip install --python .venv-test/bin/python pytest dist/wheel/repaired/*.whl
          cd test
          ../.venv-test/bin/python -c 'from ecc_tools_bin import ecc_py; print(ecc_py.__file__)'

      - name: Setup PDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 https://github.com/openecos-projects/icsprout55-pdk.git icsprout55-pdk
          cd icsprout55-pdk
          # Fetch metadata once with authentication; make otherwise repeats an
          # unauthenticated lookup for each archive and hides HTTP failures.
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/openecos-projects/icsprout55-pdk/releases/latest \
            --output release.json
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          release = json.loads(Path("release.json").read_text())
          archives = [asset for asset in release["assets"] if asset["name"].endswith(".tar.bz2")]
          if not archives:
              raise SystemExit("PDK release contains no .tar.bz2 archives")
          for asset in archives:
              name = asset["name"]
              if Path(name).name != name:
                  raise SystemExit(f"Invalid PDK archive name: {name}")
              archive = Path(name + ".part")
              subprocess.run([
                  "curl", "--fail", "--silent", "--show-error", "--location", "--retry", "3",
                  "--output", str(archive), asset["browser_download_url"],
              ], check=True)
              if archive.stat().st_size != asset["size"]:
                  raise SystemExit(f"Incomplete PDK archive: {name}")
              archive.replace(name)
          PY
          make unzip

      - name: Run Python API integration tests
        working-directory: test
        env:
          ECC_TOOLS_TEST_ARTIFACT_ROOT: ${{ github.workspace }}/test-artifacts
          ECC_TOOLS_TEST_PDK_ROOT: ${{ github.workspace }}/icsprout55-pdk
          ECC_TOOLS_TEST_REPO_ROOT: ${{ github.workspace }}
          ECC_LOGGER_THROW_ON_ERROR: '1'
        run: ../.venv-test/bin/python -m pytest data operations -v --maxfail=1

      - name: Upload Python API artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ecc-tools-python-api-artifacts
          if-no-files-found: ignore
          path: test-artifacts/

  nix-build:
    name: Nix Build (flake checks)
    runs-on: ubuntu-latest
    # Cold cache builds boost 1.91 and ecc-tools from source;
    # magic-nix-cache makes subsequent runs incremental.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          extra-conf: |
            extra-substituters = https://cache.ani.llc
            extra-trusted-public-keys = cache.ani.llc:8nINs8lCCU0Yoed1KMjLj6fCHpMmrY+sFuhGTdxLB88=

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build all flake checks
        run: nix flake check -L
